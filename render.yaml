# Una sola instancia: las salas activas se coordinan dentro del servidor.
services:
  - type: web
    name: todo-o-nada
    runtime: node
    plan: free
    branch: main
    numInstances: 1
    buildCommand: node scripts/check.js && node --test tests/*.test.js
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: ephemeral
